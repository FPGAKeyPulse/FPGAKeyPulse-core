name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - name: Install system dependencies
        run: |
          dnf install -y \
            gcc-c++ \
            git \
            gzip \
            iverilog \
            make \
            tar \
            unzip \
            verilator \
            which \
            xz \
            zlib-devel \
            zstd

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run tests
        run: sbt -batch clean test

      - name: Generate OOC targets
        run: sbt -batch 'core/runMain keypulse.core.tools.GenerateOoc matrix' 'core/runMain keypulse.core.tools.GenerateOoc hid'

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sbt -batch core/publish tester/publish

  cleanup-stalled-tests:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat-validation-ooc-bot' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // One-time cleanup of this development session's pre-timeout test runs.
            const {owner, repo} = context.repo;
            for (const [run_id, branch] of [[35493523985, 'feat-matrix-1mhz'], [35493614146, 'feat-usb3-hid-descriptors']]) {
              const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id});
              if (run.path !== '.github/workflows/ci.yml' || run.head_branch !== branch) throw Error('Unexpected cleanup target');
              if (['queued', 'in_progress'].includes(run.status)) await github.rest.actions.cancelWorkflowRun({owner, repo, run_id});
            }
