name: OOC Timing
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ooc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  timing:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - target: matrix
            top: MatrixScan
            main: GenerateOoc
            args: matrix
          - target: hid
            top: HidKeyboard
            main: GenerateOoc
            args: hid
          - target: debounce
            top: KeyDebounce
            main: GenerateDebounceOoc
            args: ''
          - target: keymap
            top: BootKeyMapper
            main: GenerateKeymapOoc
            args: ''
          - target: keyboard
            top: KeyboardCore
            main: GenerateKeyboardOoc
            args: ''
    env:
      # User-selected MLK-S02-35T, vendor manual: FGG484 package, -2 grade.
      FPGA_PART: xc7a35tfgg484-2
      # Community preinstalled Vivado 2024.1 image. The pull step records the
      # resolved digest in every artifact because Docker Hub exposes only the
      # tag in this workflow configuration.
      VIVADO_IMAGE: gusanagy/xilinx-vivado:2024.1-x11
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Free disposable hosted-runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: sbt/setup-sbt@v1
      - name: Generate RTL
        env:
          MAIN: ${{ matrix.main }}
          ARGS: ${{ matrix.args }}
        run: sbt "core/runMain keypulse.core.tools.$MAIN $ARGS"
      - name: Pull complete Vivado environment
        run: |
          docker pull "$VIVADO_IMAGE"
          mkdir -p reports
          docker image inspect "$VIVADO_IMAGE" --format '{{json .RepoDigests}}' > reports/image.json
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            "$VIVADO_IMAGE" vivado -version | tee reports/vivado-version.txt
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$PWD/scripts,dst=/scripts,readonly" \
            "$VIVADO_IMAGE" vivado -mode batch -source /scripts/preflight.tcl
      - name: Routed OOC at 100 MHz
        env:
          TOP: ${{ matrix.top }}
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --mount "type=bind,src=$PWD/generated/ooc,dst=/rtl,readonly" \
            --mount "type=bind,src=$PWD/scripts,dst=/scripts,readonly" \
            --mount "type=bind,src=$PWD/reports,dst=/reports" \
            --workdir /reports "$VIVADO_IMAGE" \
            vivado -mode batch -source /scripts/ooc.tcl \
            -tclargs "$FPGA_PART" "$TOP" /rtl /reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ooc-${{ matrix.target }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: reports/
